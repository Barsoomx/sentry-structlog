name: Publish to PyPI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          expected_tag = f"v{project['version']}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Tag {actual_tag!r} does not match {expected_tag!r}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Check installed wheel
        run: |
          python -m pip install dist/*.whl
          python -I - <<'PY'
          from importlib.metadata import distribution
          from sentry_structlog import SentryProcessor

          package = distribution("sentry-structlog")
          assert package.locate_file("sentry_structlog/py.typed").is_file()
          print(f"Installed {package.metadata['Name']} {package.version}: {SentryProcessor}")
          PY
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish with PyPI Trusted Publishing
    needs: [build, tests]
    if: github.repository == 'Barsoomx/sentry-structlog' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sentry-structlog
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
