name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-tests
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.6"

jobs:
  lint:
    name: Code Quality (Ruff, Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12
      - name: Ruff check
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      - name: Mypy type check
        run: uv run --no-sync mypy sentry_structlog
      - name: Check invalid API calls remain rejected
        run: uv run --no-sync mypy --strict --warn-unused-ignores --python-version 3.10 scripts/typing_negative.py

  pyright:
    name: Pyright type check
    runs-on: ubuntu-latest
    # TODO(#36): fix package _NAME_TO_LEVEL import and Event assignment diagnostics.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12
      - name: Pyright package and consumer checks
        run: uv run --no-sync pyright --pythonversion 3.10 sentry_structlog scripts/wheel_consumer.py scripts/typing_negative.py

  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          - python: "3.12"
            os: windows-2022
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python "${{ matrix.python }}"
      - name: Record installed dependency versions
        run: uv pip freeze
      - name: Run tests with coverage and JUnit
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn

  e2e:
    name: Django/Granian end-to-end concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12
      - name: Run end-to-end tests
        run: uv run --no-sync pytest -m e2e test/e2e -q

  dependencies:
    name: Dependencies (${{ matrix.endpoint }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        endpoint: [min, latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked tooling
        run: uv sync --locked --all-groups --python 3.10
      - name: Install built wheel without changing lane dependencies
        run: |
          uv build --wheel
          uv pip install --reinstall --no-deps dist/*.whl
      - name: Install minimum runtime dependencies
        if: matrix.endpoint == 'min'
        run: uv pip install "sentry-sdk==2.15.0" "structlog==23.1.0"
      - name: Install latest stable runtime dependencies
        if: matrix.endpoint == 'latest'
        run: uv pip install --upgrade "sentry-sdk>=2.15,<3" "structlog>=23.1.0"
      - name: Record installed dependency versions
        run: uv pip freeze
      # Do not let uv run restore the locked versions after selecting an endpoint.
      - name: Run endpoint tests with coverage and JUnit
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Check installed wheel and consumer typing with lane dependencies
        run: |
          cp scripts/wheel_consumer.py "$RUNNER_TEMP/wheel_consumer.py"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I wheel_consumer.py
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m mypy --strict --python-version 3.10 wheel_consumer.py
      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-dependencies-${{ matrix.endpoint }}
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn

  sdk-prerelease:
    name: Sentry SDK prerelease
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12
      - name: Install Sentry SDK prerelease
        run: uv pip install --pre "sentry-sdk>=3.0.0a0"
      - name: Record installed dependency versions
        run: uv pip freeze
      - name: Run prerelease tests
        run: uv run --no-sync pytest

  package:
    name: Package and typed wheel consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==$UV_VERSION"
      - name: Install locked tooling
        run: uv sync --locked --all-groups --python 3.12
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata and contents
        run: |
          uv run --no-sync twine check --strict dist/*
          uv run --no-sync python scripts/check_artifacts.py
      - name: Install wheel in a clean environment
        run: |
          uv venv .venv-wheel --python 3.12
          uv pip install --python .venv-wheel/bin/python dist/*.whl "mypy==1.20.0"
      - name: Check installed wheel and consumer typing outside checkout
        run: |
          cp scripts/wheel_consumer.py "$RUNNER_TEMP/wheel_consumer.py"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -I wheel_consumer.py
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" -I -m mypy --strict --python-version 3.10 wheel_consumer.py
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-distributions
          path: dist/*
          if-no-files-found: error
