[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-structlog"
version = "3.0.0"
description = "Sentry integration for structlog (thread-safe fork of structlog-sentry)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kiwi.com platform", email = "platform@kiwi.com" }]
dependencies = ["sentry-sdk>=2.15,<3", "structlog>=23.1.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Barsoomx/sentry-structlog"
Repository = "https://github.com/Barsoomx/sentry-structlog"
Issues = "https://github.com/Barsoomx/sentry-structlog/issues"

[dependency-groups]
e2e = [
    "django>=5.2",
    "django-structlog>=9",
    "granian>=2",
    "requests>=2.32",
]
dev = [
    "pytest>=8",
    "pytest-mock>=3.8.2",
    "pytest-cov>=6",
    "ruff==0.15.17",
    "mypy==1.20.0",
    "twine>=6",
]

[tool.setuptools.packages.find]
include = ["sentry_structlog*"]

[tool.setuptools.package-data]
sentry_structlog = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["sentry_structlog"]

[tool.mypy]
python_version = "3.10"
files = ["sentry_structlog"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-m 'not e2e'"
markers = ["e2e: Django/Granian end-to-end concurrency tests (opt in)"]

[tool.coverage.run]
branch = true
source = ["sentry_structlog"]

[tool.coverage.report]
show_missing = true
fail_under = 90
